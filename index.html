let user=null;
let profile=null;
let selectedSkills=[];

const skills=["HTML","CSS","JavaScript","React","Node","Python","SQL","AWS","Docker","Figma"];

const skillsDiv=document.getElementById("skills");

const jobsDiv=document.getElementById("jobs");

const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");

const uploadResumeBtn=document.getElementById("uploadResumeBtn");

function updateAuthUI(){
  const isLoggedIn=!!user;

  signupBtn.classList.toggle("hidden", isLoggedIn);
  loginBtn.classList.toggle("hidden", isLoggedIn);
  logoutBtn.classList.toggle("hidden", !isLoggedIn);
  employerCard.classList.toggle("hidden", profile?.role!=="employer");
}

function escapeHtml(value=""){
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

function normalizeSkills(value){
  if(Array.isArray(value)) return value.filter(Boolean);
  if(typeof value==="string"){
    return value.split(",").map(s=>s.trim()).filter(Boolean);
  }
  return [];
}

function parseApplicationStatus(value){
  if(!value) return { state:"submitted" };
  if(typeof value!=="string") return { state:"submitted" };

  try{
    const parsed=JSON.parse(value);
    if(parsed && typeof parsed==="object"){
      return {
        state:parsed.state || "submitted",
        applicant_name:parsed.applicant_name || "",
        resume_url:parsed.resume_url || "",
        skills:normalizeSkills(parsed.skills)
      };
    }
  }catch(_error){}

  return { state:value, applicant_name:"", resume_url:"", skills:[] };
}

function buildApplicationStatus(state, details={}){
  return JSON.stringify({
    state,
    applicant_name:details.applicant_name || "",
    resume_url:details.resume_url || "",
    skills:normalizeSkills(details.skills)
  });
}

function addBusinessDays(startDate, businessDays){
  const result=new Date(startDate);
  let remaining=businessDays;

  while(remaining>0){
    result.setDate(result.getDate()+1);
    const day=result.getDay();
    if(day!==0 && day!==6) remaining-=1;
  }

  return result;
}

function formatTimeRemaining(deadline){
  const now=new Date();
  if(deadline<=now) return "Expired";

  let current=new Date(now);
  let businessDays=0;

  while(true){
    const nextDay=new Date(current);
    nextDay.setHours(0,0,0,0);
    nextDay.setDate(nextDay.getDate()+1);
    if(nextDay>deadline) break;
    const day=nextDay.getDay();
    if(day!==0 && day!==6) businessDays+=1;
    current=nextDay;
  }

  const diffMs=deadline-now;
  const hours=Math.floor(diffMs/(1000*60*60));
  const minutes=Math.floor((diffMs%(1000*60*60))/(1000*60));

  if(businessDays>0){
    return `${businessDays} business day${businessDays===1?"":"s"} left`;
  }

  if(hours>0){
    return `${hours} hour${hours===1?"":"s"} ${minutes} min left`;
  }

  return `${Math.max(minutes,1)} min left`;
}

async function refreshMyApplications(){
  myApplicationJobIds=new Set();
  if(!user || profile?.role==="employer") return;

  const {data,error}=await supabase
    .from("applications")
    .select("job_id")
    .eq("user_id",user.id);

  if(error){
    console.error("Failed to load applicant applications:", error);
    return;
  }

  myApplicationJobIds=new Set((data||[]).map(item=>item.job_id));
}

async function ensureProfile(authUser, preferredRole=null){
  if(!authUser) return null;

  const metadataRole=authUser.user_metadata?.role;
  const fallbackRole=preferredRole || metadataRole || "applicant";

  const {data:existing,error:fetchError}=await supabase
    .from("users")
    .select("*")
    .eq("id",authUser.id)
    .maybeSingle();

  if(fetchError) throw fetchError;

  const payload={
    id:authUser.id,
    role:preferredRole || existing?.role || fallbackRole,
    skills:normalizeSkills(existing?.skills),
    resume_url:existing?.resume_url || null
  };

  const {data:upserted,error:upsertError}=await supabase
    .from("users")
    .upsert(payload)
    .select()
    .single();

  if(upsertError) throw upsertError;
  return upserted;
}

async function syncAuthState(session=null, preferredRole=null){
  user=session?.user || null;
  updateAuthUI();

  if(!user){
    profile=null;
    selectedSkills=[];
    resumeStatus.textContent="";
    renderSkills(skillSearch.value);
    renderMySkills();
    myJobsDiv.innerHTML="";
    appDiv.innerHTML="";
    startEmployerTimer();
    await loadJobs();
    return;
  }

  profile={
    id:user.id,
    role:preferredRole || user.user_metadata?.role || "applicant",
    full_name:user.user_metadata?.full_name || "",
    skills:[],
    resume_url:null
  };
  selectedSkills=[];
  resumeStatus.textContent="";
  nameInput.value=profile.full_name || "";
  updateAuthUI();
  renderSkills(skillSearch.value);
  renderMySkills();
  await loadJobs();

  try{
    const dbProfile=await ensureProfile(user, preferredRole);
    profile={
      ...profile,
      ...dbProfile,
      skills:normalizeSkills(dbProfile?.skills),
      resume_url:dbProfile?.resume_url || null
    };
    selectedSkills=[...profile.skills];
    profile.full_name=user.user_metadata?.full_name || "";
    nameInput.value=profile.full_name || "";
    resumeStatus.innerHTML=profile.resume_url
      ? `<a href="${profile.resume_url}" target="_blank">View Resume</a>`
      : "";
  }catch(error){
    console.error("Profile sync failed:", error);
    alert(`Logged in, but your database blocked profile loading: ${error.message}`);
  }

  updateAuthUI();
  renderSkills(skillSearch.value);
  renderMySkills();
  await refreshMyApplications();
  await loadJobs();

  if(profile?.role==="employer"){
    await loadMyJobs();
    await loadApplications();
  }else{
    myJobsDiv.innerHTML="";
    appDiv.innerHTML="";
  }
  startEmployerTimer();
}

/* ================= SKILLS ================= */
function renderSkills(filter=""){
  skillsDiv.innerHTML="";
  skills.filter(s=>s.toLowerCase().includes(filter.toLowerCase())).forEach(s=>{
    const el=document.createElement("span");
    el.className="skill";
    if(selectedSkills.includes(s)) el.classList.add("selected");
    el.innerText=s;
    el.onclick=()=>{
      selectedSkills = selectedSkills.includes(s)
        ? selectedSkills.filter(x=>x!==s)
        : [...selectedSkills,s];
      renderSkills(filter);
      renderMySkills();
    };
    skillsDiv.appendChild(el);
  });
}

function renderMySkills(){
  mySkillsDiv.innerHTML="";
  selectedSkills.forEach(s=>{
    const el=document.createElement("span");
    el.className="skill selected";
    el.innerText=s;
    mySkillsDiv.appendChild(el);
  });
}

/* ================= AUTH FIX ================= */

signupBtn.onclick=async()=>{
  const email=prompt("Email");
  const password=prompt("Password");
  if(!email || !password)return;

  const roleChoice=confirm("OK = Employer, Cancel = Applicant");
  const role=roleChoice?"employer":"applicant";

  const {data,error}=await supabase.auth.signUp({
    email,
    password,
    options:{ data:{ role } }
  });
  if(error)return alert(error.message);
  await syncAuthState(data.session, role);
  alert(data.session ? "Account created and logged in." : "Account created. Check your email before logging in if confirmation is required.");
};

loginBtn.onclick=async()=>{
  const email=prompt("Email");
  const password=prompt("Password");
  if(!email || !password)return;

  const {data,error}=await supabase.auth.signInWithPassword({email,password});
  if(error)return alert(error.message);
  await syncAuthState(data.session);
};

logoutBtn.onclick=async()=>{
  const {error}=await supabase.auth.signOut();
  if(error)return alert(error.message);
  user=null;
  profile=null;
  selectedSkills=[];
  resumeStatus.textContent="";
  updateAuthUI();
  renderSkills(skillSearch.value);
  renderMySkills();
  myApplicationJobIds=new Set();
  await loadJobs();
  myJobsDiv.innerHTML="";
  appDiv.innerHTML="";
  startEmployerTimer();
};

/* ================= USER FIXED ================= */

async function checkUser(){
  const {data,error}=await supabase.auth.getSession();
  if(error){
    alert(error.message);
    return;
  }
  await syncAuthState(data.session);
}

/* ================= PROFILE ================= */

saveBtn.onclick=async()=>{
  if(!user)return alert("Please log in first.");
  const fullName=nameInput.value.trim();
  const {error}=await supabase.from("users").update({skills:selectedSkills}).eq("id",user.id);
  if(error)return alert(error.message);
  const {error:authUpdateError}=await supabase.auth.updateUser({
    data:{ full_name:fullName }
  });
  if(authUpdateError)return alert(authUpdateError.message);
  if(profile) profile.skills=[...selectedSkills];
  if(profile) profile.full_name=fullName;
  alert("saved");
};

uploadResumeBtn.onclick=async()=>{
  if(!user)return alert("Please log in first.");
  const file=resumeInput.files[0];
  if(!file)return alert("Please choose a PDF first.");
  const path=`${user.id}/${Date.now()}-${file.name}`;

  const {error:uploadError}=await supabase.storage.from("resumes").upload(path,file);
  if(uploadError)return alert(uploadError.message);

  const {data}=supabase.storage.from("resumes").getPublicUrl(path);

  const {error:updateError}=await supabase.from("users").update({resume_url:data.publicUrl}).eq("id",user.id);
  if(updateError)return alert(updateError.message);

  if(profile) profile.resume_url=data.publicUrl;
  resumeStatus.innerHTML=`<a href="${data.publicUrl}" target="_blank">View Resume</a>`;
};

/* ================= JOBS ================= */

async function loadJobs(){
  const {data,error}=await supabase.from("jobs").select("*").order("id",{ascending:false});
  if(error){
    jobsDiv.innerHTML=`<p>${error.message}</p>`;
    return;
  }
  jobsDiv.innerHTML="";

  (data||[]).forEach(job=>{
    const div=document.createElement("div");
    div.className="job";
    div.innerHTML=`
      <b>${escapeHtml(job.title || "Untitled Job")}</b>
      <p>${escapeHtml(job.description || "")}</p>
    `;

    const btn=document.createElement("button");
    const alreadyApplied=myApplicationJobIds.has(job.id);
    btn.innerText=alreadyApplied ? "Applied" : "Apply";
    btn.disabled=!user || profile?.role==="employer" || alreadyApplied;
    btn.onclick=async()=>{
      if(!user)return alert("Please log in first.");
      if(profile?.role==="employer")return alert("Employer accounts cannot apply to jobs.");
      if(!profile?.resume_url)return alert("Upload your resume before applying.");
      if(myApplicationJobIds.has(job.id))return alert("You already applied to this job.");

      const applicantName=nameInput.value.trim() || profile?.full_name || "Unnamed Applicant";
      const applicationStatus=buildApplicationStatus("submitted",{
        applicant_name:applicantName,
        resume_url:profile?.resume_url || "",
        skills:selectedSkills
      });

      const {error:applyError}=await supabase
        .from("applications")
        .insert({
          job_id:job.id,
          user_id:user.id,
          status:applicationStatus
        });
      if(applyError)return alert(applyError.message);
      myApplicationJobIds.add(job.id);
      await loadJobs();
      alert("Applied!");
    };

    div.appendChild(btn);
    jobsDiv.appendChild(div);
  });
}

/* ================= EMPLOYER ================= */

postJobBtn.onclick=async()=>{
  if(!user || profile?.role!=="employer")return alert("Only employers can post jobs.");
  const title=jobTitle.value.trim();
  const desc=jobDesc.value.trim();
  const skills=jobSkills.value.split(",").map(s=>s.trim()).filter(Boolean);
  if(!title || !desc)return alert("Enter a job title and description.");
  const fullDescription=skills.length
    ? `${desc}\n\nRequired skills: ${skills.join(", ")}`
    : desc;

  const {error}=await supabase.from("jobs").insert({
    title,
    description:fullDescription,
    employer_id:user.id
  });
  if(error)return alert(error.message);

  jobTitle.value="";
  jobDesc.value="";
  jobSkills.value="";
  await loadJobs();
  await loadMyJobs();
};

async function loadMyJobs(){
  if(!user)return;
  const {data,error}=await supabase.from("jobs").select("*").eq("employer_id",user.id).order("id",{ascending:false});
  if(error){
    myJobsDiv.innerHTML=`<p>${error.message}</p>`;
    return;
  }
  myJobsDiv.innerHTML="";
  (data||[]).forEach(j=>{
    const d=document.createElement("div");
    d.className="job";
    d.innerHTML=`<b>${escapeHtml(j.title || "Untitled Job")}</b><p>${escapeHtml(j.description || "")}</p>`;
    myJobsDiv.appendChild(d);
  });
}

async function loadApplications(){
  if(!user)return;
  const {data:jobs,error:jobsError}=await supabase
    .from("jobs")
    .select("id,title")
    .eq("employer_id",user.id);

  if(jobsError){
    appDiv.innerHTML=`<p>${jobsError.message}</p>`;
    return;
  }

  if(!jobs?.length){
    appDiv.innerHTML="<p>No applications yet.</p>";
    return;
  }

  const jobMap=new Map(jobs.map(job=>[job.id,job]));
  const jobIds=jobs.map(job=>job.id);

  const {data:applications,error:applicationsError}=await supabase
    .from("applications")
    .select("*")
    .in("job_id",jobIds)
    .order("id",{ascending:false});

  if(applicationsError){
    appDiv.innerHTML=`<p>${applicationsError.message}</p>`;
    return;
  }

  const applicantIds=[...new Set((applications||[]).map(a=>a.user_id).filter(Boolean))];
  let profileMap=new Map();

  if(applicantIds.length){
    const {data:userProfiles,error:userProfilesError}=await supabase
      .from("users")
      .select("id,skills,resume_url")
      .in("id",applicantIds);

    if(userProfilesError){
      appDiv.innerHTML=`<p>${userProfilesError.message}</p>`;
      return;
    }

    profileMap=new Map((userProfiles||[]).map(p=>[p.id,p]));
  }

  appDiv.innerHTML="";
  if(!(applications||[]).length){
    appDiv.innerHTML="<p>No applications yet.</p>";
    return;
  }

  (applications||[]).forEach(a=>{
    const applicant=profileMap.get(a.user_id) || {};
    const applicationMeta=parseApplicationStatus(a.status);
    const applicantSkills=applicationMeta.skills.length
      ? applicationMeta.skills
      : normalizeSkills(applicant.skills);
    const job=jobMap.get(a.job_id);
    const createdAt=a.created_at ? new Date(a.created_at) : new Date();
    const responseDeadline=addBusinessDays(createdAt,10);
    const finalState=applicationMeta.state || "submitted";
    const closed=finalState==="accepted" || finalState==="rejected";
    const expired=!closed && responseDeadline<=new Date();
    const responseState=closed ? "Decision made" : (expired ? "Expired" : formatTimeRemaining(responseDeadline));
    const applicantResume=applicationMeta.resume_url || applicant.resume_url || "";
    const applicantName=applicationMeta.applicant_name || a.user_id || "Unknown";
    const d=document.createElement("div");
    d.className="job";
    d.innerHTML=`
      <b>${escapeHtml(job?.title || "Job")}</b><br>
      Applicant: ${escapeHtml(applicantName)}<br>
      Skills: ${escapeHtml(applicantSkills.join(", ") || "None listed")}<br>
      Resume: ${applicantResume ? `<a href="${applicantResume}" target="_blank">Open Resume</a>` : "No resume uploaded"}<br>
      <small>Status: ${escapeHtml(expired ? "expired" : finalState)}</small><br>
      <small>Respond by: ${escapeHtml(responseDeadline.toLocaleString())}</small><br>
      <small>Time remaining: ${escapeHtml(responseState)}</small>
    `;

    if(!closed && !expired){
      const acceptBtn=document.createElement("button");
      acceptBtn.innerText="Accept";
      acceptBtn.onclick=async()=>{
        const {error}=await supabase
          .from("applications")
          .update({
            status:buildApplicationStatus("accepted",applicationMeta)
          })
          .eq("id",a.id);
        if(error)return alert(error.message);
        await loadApplications();
      };

      const rejectBtn=document.createElement("button");
      rejectBtn.innerText="Reject";
      rejectBtn.style.marginLeft="8px";
      rejectBtn.onclick=async()=>{
        const {error}=await supabase
          .from("applications")
          .update({
            status:buildApplicationStatus("rejected",applicationMeta)
          })
          .eq("id",a.id);
        if(error)return alert(error.message);
        await loadApplications();
      };

      d.appendChild(document.createElement("br"));
      d.appendChild(acceptBtn);
      d.appendChild(rejectBtn);
    }

    appDiv.appendChild(d);
  });
}

function startEmployerTimer(){
  if(employerTimerInterval){
    clearInterval(employerTimerInterval);
    employerTimerInterval=null;
  }

  if(profile?.role!=="employer") return;

  employerTimerInterval=setInterval(()=>{
    loadApplications();
  },60000);
}

/* ================= INIT ================= */

skillSearch.oninput=e=>renderSkills(e.target.value);
supabase.auth.onAuthStateChange(async(_event,session)=>{
  if(!authReady) return;
  await syncAuthState(session);
});
await checkUser();
authReady=true;
renderSkills();
updateAuthUI();
startEmployerTimer();

</script>
