<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>QuickHire</title>

<style>
body{font-family:Arial;margin:0;background:#f4f7fb;}
header{background:#0b63ce;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center;}
.container{padding:20px;}
.card{background:white;padding:15px;border-radius:10px;margin-top:15px;}
.skill{padding:6px 10px;border:1px solid #ccc;border-radius:20px;margin:4px;display:inline-block;cursor:pointer;}
.selected{background:#0b63ce;color:white;}
.hidden{display:none;}
.job{border:1px solid #ddd;padding:10px;border-radius:8px;margin:10px 0;}
button{cursor:pointer;}
</style>
</head>

<body>

<header>
<h2>QuickHire</h2>
<div>
<button id="signupBtn">Sign Up</button>
<button id="loginBtn">Login</button>
<button id="logoutBtn" class="hidden">Logout</button>
</div>
</header>

<div class="container">

<div class="card">
<h3>Profile Skills</h3>
<input id="skillSearch" placeholder="Search skills">
<div id="skills"></div>
<h4>Saved Skills</h4>
<div id="mySkills"></div>
<button id="saveBtn">Save Skills</button>

<br><br>
<h4>Resume</h4>
<input type="file" id="resumeInput" accept="application/pdf">
<button id="uploadResumeBtn">Upload Resume</button>
<p id="resumeStatus"></p>
</div>

<div class="card">
<h3>Jobs</h3>
<div id="jobs"></div>
</div>

<div class="card hidden" id="employerCard">
<h3>Employer Dashboard</h3>
<input id="jobTitle" placeholder="Job title"><br>
<textarea id="jobDesc" placeholder="Job description"></textarea><br>
<input id="jobSkills" placeholder="Skills (comma separated)"><br>
<button id="postJobBtn">Post Job</button>

<h4>Your Jobs</h4>
<div id="myJobs"></div>

<h4>Applications</h4>
<div id="applications"></div>
</div>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://cwrschafpaerspklvoqk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3cnNjaGFmcGFlcnNwa2x2b3FrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NzM2MjIsImV4cCI6MjA4OTU0OTYyMn0.qaUuhw5YSi7aa_rT7dFrck26BnvSaAFSrrBwfclaCPw"
);

let user=null;
let profile=null;
let selectedSkills=[];

const skills=["HTML","CSS","JavaScript","React","Node","Python","SQL","AWS","Docker","Figma"];

const skillsDiv=document.getElementById("skills");
const mySkillsDiv=document.getElementById("mySkills");
const jobsDiv=document.getElementById("jobs");
const myJobsDiv=document.getElementById("myJobs");
const appDiv=document.getElementById("applications");
const resumeStatus=document.getElementById("resumeStatus");
const signupBtn=document.getElementById("signupBtn");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");
const saveBtn=document.getElementById("saveBtn");
const uploadResumeBtn=document.getElementById("uploadResumeBtn");
const resumeInput=document.getElementById("resumeInput");
const employerCard=document.getElementById("employerCard");
const postJobBtn=document.getElementById("postJobBtn");
const jobTitle=document.getElementById("jobTitle");
const jobDesc=document.getElementById("jobDesc");
const jobSkills=document.getElementById("jobSkills");
const skillSearch=document.getElementById("skillSearch");

function updateAuthUI(){
  const isLoggedIn=!!user;

  signupBtn.classList.toggle("hidden", isLoggedIn);
  loginBtn.classList.toggle("hidden", isLoggedIn);
  logoutBtn.classList.toggle("hidden", !isLoggedIn);
  employerCard.classList.toggle("hidden", profile?.role!=="employer");
}

/* ================= SKILLS ================= */
function renderSkills(filter=""){
  skillsDiv.innerHTML="";
  skills.filter(s=>s.toLowerCase().includes(filter.toLowerCase())).forEach(s=>{
    const el=document.createElement("span");
    el.className="skill";
    if(selectedSkills.includes(s)) el.classList.add("selected");
    el.innerText=s;
    el.onclick=()=>{
      selectedSkills = selectedSkills.includes(s)
        ? selectedSkills.filter(x=>x!==s)
        : [...selectedSkills,s];
      renderSkills(filter);
      renderMySkills();
    };
    skillsDiv.appendChild(el);
  });
}

function renderMySkills(){
  mySkillsDiv.innerHTML="";
  selectedSkills.forEach(s=>{
    const el=document.createElement("span");
    el.className="skill selected";
    el.innerText=s;
    mySkillsDiv.appendChild(el);
  });
}

/* ================= AUTH FIX ================= */

signupBtn.onclick=async()=>{
  const email=prompt("Email");
  const password=prompt("Password");
  if(!email || !password)return;

  const roleChoice=confirm("OK = Employer, Cancel = Applicant");
  const role=roleChoice?"employer":"applicant";

  const {data,error}=await supabase.auth.signUp({email,password});
  if(error)return alert(error.message);

  if(data.user){
    const {error:profileError}=await supabase.from("users").upsert({
      id:data.user.id,
      role,
      skills:[],
      resume_url:null
    });
    if(profileError){
      alert(profileError.message);
      return;
    }
  }

  await checkUser();
  alert(data.session ? "Account created and logged in." : "Account created. Check your email if confirmation is required.");
};

loginBtn.onclick=async()=>{
  const email=prompt("Email");
  const password=prompt("Password");
  if(!email || !password)return;

  const {error}=await supabase.auth.signInWithPassword({email,password});
  if(error)return alert(error.message);

  await checkUser();
};

logoutBtn.onclick=async()=>{
  await supabase.auth.signOut();
  user=null;
  profile=null;
  selectedSkills=[];
  resumeStatus.textContent="";
  updateAuthUI();
  renderSkills(skillSearch.value);
  renderMySkills();
  loadJobs();
  myJobsDiv.innerHTML="";
  appDiv.innerHTML="";
};

/* ================= USER FIXED ================= */

async function checkUser(){
  const {data:{user:u},error:userError}=await supabase.auth.getUser();
  if(userError){
    alert(userError.message);
    return;
  }

  user=u;
  if(!user){
    profile=null;
    selectedSkills=[];
    updateAuthUI();
    renderSkills(skillSearch.value);
    renderMySkills();
    return;
  }

  let {data:p,error:profileError}=await supabase.from("users").select("*").eq("id",user.id).maybeSingle();
  if(profileError){
    alert(profileError.message);
    return;
  }

  if(!p){
    const {data,error:insertError}=await supabase.from("users").insert({
      id:user.id,
      role:"applicant",
      skills:[],
      resume_url:null
    }).select().single();
    if(insertError){
      alert(insertError.message);
      return;
    }
    p=data;
  }

  profile=p;
  selectedSkills=profile.skills||[];

  updateAuthUI();

  loadJobs();

  if(profile.role==="employer"){
    loadMyJobs();
    loadApplications();
  } else {
    myJobsDiv.innerHTML="";
    appDiv.innerHTML="";
  }

  renderSkills();
  renderMySkills();
}

/* ================= PROFILE ================= */

saveBtn.onclick=async()=>{
  if(!user)return alert("Please log in first.");
  await supabase.from("users").update({skills:selectedSkills}).eq("id",user.id);
  alert("saved");
};

uploadResumeBtn.onclick=async()=>{
  if(!user)return alert("Please log in first.");
  const file=resumeInput.files[0];
  if(!file)return alert("Please choose a PDF first.");
  const path=`${user.id}/${Date.now()}-${file.name}`;

  const {error:uploadError}=await supabase.storage.from("resumes").upload(path,file);
  if(uploadError)return alert(uploadError.message);

  const {data}=supabase.storage.from("resumes").getPublicUrl(path);

  const {error:updateError}=await supabase.from("users").update({resume_url:data.publicUrl}).eq("id",user.id);
  if(updateError)return alert(updateError.message);

  resumeStatus.innerHTML=`<a href="${data.publicUrl}" target="_blank">View Resume</a>`;
};

/* ================= JOBS ================= */

async function loadJobs(){
  const {data,error}=await supabase.from("jobs").select("*");
  if(error){
    jobsDiv.innerHTML=`<p>${error.message}</p>`;
    return;
  }
  jobsDiv.innerHTML="";

  (data||[]).forEach(job=>{
    const div=document.createElement("div");
    div.className="job";
    div.innerHTML=`<b>${job.title}</b><p>${job.description}</p>`;

    const btn=document.createElement("button");
    btn.innerText="Apply";
    btn.disabled=!user;
    btn.onclick=async()=>{
      if(!user)return alert("Please log in first.");
      await supabase.from("applications").insert({job_id:job.id,user_id:user.id,cover_letter:"Resume attached"});
      alert("Applied!");
    };

    div.appendChild(btn);
    jobsDiv.appendChild(div);
  });
}

/* ================= EMPLOYER ================= */

postJobBtn.onclick=async()=>{
  if(!user || profile?.role!=="employer")return alert("Only employers can post jobs.");
  const title=jobTitle.value;
  const desc=jobDesc.value;
  const skills=jobSkills.value.split(",").map(s=>s.trim());

  await supabase.from("jobs").insert({
    title,
    description:desc,
    skills,
    employer_id:user.id
  });

  loadMyJobs();
};

async function loadMyJobs(){
  if(!user)return;
  const {data}=await supabase.from("jobs").select("*").eq("employer_id",user.id);
  myJobsDiv.innerHTML="";
  (data||[]).forEach(j=>{
    const d=document.createElement("div");
    d.className="job";
    d.innerHTML=j.title;
    myJobsDiv.appendChild(d);
  });
}

async function loadApplications(){
  if(!user)return;
  const {data}=await supabase.from("applications").select("*,jobs(title)");
  appDiv.innerHTML="";
  (data||[]).forEach(a=>{
    const d=document.createElement("div");
    d.className="job";
    d.innerHTML=`Job: ${a.jobs?.title}<br>User: ${a.user_id}`;
    appDiv.appendChild(d);
  });
}

/* ================= INIT ================= */

skillSearch.oninput=e=>renderSkills(e.target.value);
supabase.auth.onAuthStateChange(async()=>{ await checkUser(); });
checkUser();
renderSkills();
updateAuthUI();

</script>

</body>
</html>
