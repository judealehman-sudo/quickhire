<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuickHire</title>

<style>
body{font-family:Arial;margin:0;background:#f4f7fb;}
header{background:#0b63ce;color:white;padding:15px;display:flex;justify-content:space-between;}
.container{max-width:1000px;margin:auto;padding:20px;}
.job{background:white;padding:15px;margin:10px 0;border-radius:8px;}
.skill{padding:5px 10px;border:1px solid #ccc;border-radius:20px;margin:3px;display:inline-block;cursor:pointer;}
.selected{background:#0b63ce;color:white;}
.hidden{display:none;}
</style>
</head>

<body>

<header>
<h2>QuickHire</h2>
<div>
<button id="signupBtn">Sign Up</button>
<button id="loginBtn">Login</button>
<button id="logoutBtn" class="hidden">Logout</button>
</div>
</header>

<div class="container">

<!-- APPLICANT -->
<div id="applicantView">

<h3>Jobs</h3>
<div id="jobs"></div>

<h3>Your Skills</h3>
<div id="skills"></div>
<button onclick="saveSkills()">Save Skills</button>

<h3>Upload Resume</h3>
<input type="file" id="resume">
<button onclick="uploadResume()">Upload</button>

</div>

<!-- EMPLOYER -->
<div id="employerView" class="hidden">

<h3>Create Job</h3>
<input id="jobTitle" placeholder="Title"><br>
<input id="jobDesc" placeholder="Description"><br>
<div id="jobSkills"></div>
<button onclick="postJob()">Post Job</button>

<h3>Your Jobs</h3>
<div id="myJobs"></div>

</div>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient("https://cwrschafpaerspklvoqk.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3cnNjaGFmcGFlcnNwa2x2b3FrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NzM2MjIsImV4cCI6MjA4OTU0OTYyMn0.qaUuhw5YSi7aa_rT7dFrck26BnvSaAFSrrBwfclaCPw");

let user=null;
let selectedSkills=[];
let selectedJobSkills=[];
let jobs=[];

const skillList=["HTML","CSS","JS","React","Node","Python","SQL","AWS","Docker"];

const skillsDiv=document.getElementById("skills");
const jobSkillsDiv=document.getElementById("jobSkills");

/* ===== SKILLS UI ===== */

function renderSkillOptions(container, selected, toggleFn){
container.innerHTML="";
skillList.forEach(s=>{
const el=document.createElement("span");
el.innerText=s;
el.className="skill";
if(selected.includes(s)) el.classList.add("selected");

el.onclick=()=>toggleFn(s);
container.appendChild(el);
});
}

function toggleUserSkill(skill){
selectedSkills.includes(skill)
? selectedSkills=selectedSkills.filter(x=>x!==skill)
: selectedSkills.push(skill);

renderSkillOptions(skillsDiv,selectedSkills,toggleUserSkill);
}

function toggleJobSkill(skill){
selectedJobSkills.includes(skill)
? selectedJobSkills=selectedJobSkills.filter(x=>x!==skill)
: selectedJobSkills.push(skill);

renderSkillOptions(jobSkillsDiv,selectedJobSkills,toggleJobSkill);
}

/* ===== SAVE SKILLS ===== */

async function saveSkills(){
const { error } = await supabase.from("users")
.update({skills:selectedSkills})
.eq("id",user.id);

if(error) return alert(error.message);
alert("Saved");
}

/* ===== JOBS ===== */

async function loadJobs(){
const { data } = await supabase.from("jobs").select("*");
jobs=data||[];
renderJobs();
}

function renderJobs(){
const container=document.getElementById("jobs");
container.innerHTML="";

jobs.forEach(job=>{
const match=(job.skills||[]).filter(s=>selectedSkills.includes(s)).length;
const percent=job.skills?.length?Math.round(match/job.skills.length*100):0;

const div=document.createElement("div");
div.className="job";

div.innerHTML=`
<b>${job.title}</b>
<p>${job.description}</p>
<p>Match: ${percent}%</p>
<button onclick="apply('${job.id}')">Apply</button>
`;

container.appendChild(div);
});
}

/* ===== APPLY ===== */

window.apply=async(id)=>{
const { data } = await supabase.from("applications")
.select("*")
.eq("job_id",id)
.eq("user_id",user.id);

if(data.length) return alert("Already applied");

await supabase.from("applications")
.insert({job_id:id,user_id:user.id});

alert("Applied");
};

/* ===== EMPLOYER ===== */

async function postJob(){
await supabase.from("jobs").insert({
title:jobTitle.value,
description:jobDesc.value,
skills:selectedJobSkills,
employer_id:user.id
});
loadMyJobs();
}

async function loadMyJobs(){
const { data } = await supabase.from("jobs")
.select("*")
.eq("employer_id",user.id);

const container=document.getElementById("myJobs");
container.innerHTML="";

for(const job of data||[]){
const { data:apps } = await supabase.from("applications")
.select("*")
.eq("job_id",job.id);

const div=document.createElement("div");
div.className="job";
div.innerHTML=`
<b>${job.title}</b>
<p>${apps.length} applicants</p>
`;

container.appendChild(div);
}
}

/* ===== RESUME ===== */

async function uploadResume(){
const file=document.getElementById("resume").files[0];
if(!file) return;

const { error } = await supabase.storage
.from("resumes")
.upload(`${user.id}/resume.pdf`,file,{upsert:true});

if(error) alert(error.message);
else alert("Uploaded");
}

/* ===== AUTH ===== */

signupBtn.onclick=async()=>{
const email=prompt("Email");
const password=prompt("Password");
const role=confirm("Employer?")?"employer":"applicant";

const { data } = await supabase.auth.signUp({email,password});

await supabase.from("users").insert({
id:data.user.id,
role,
skills:[]
});
};

loginBtn.onclick=async()=>{
const email=prompt("Email");
const password=prompt("Password");
await supabase.auth.signInWithPassword({email,password});
checkUser();
};

logoutBtn.onclick=async()=>{
await supabase.auth.signOut();
location.reload();
};

/* ===== USER ===== */

async function checkUser(){
const { data } = await supabase.auth.getUser();
user=data.user;

if(!user) return;

signupBtn.classList.add("hidden");
loginBtn.classList.add("hidden");
logoutBtn.classList.remove("hidden");

const { data:profile } = await supabase
.from("users")
.select("*")
.eq("id",user.id)
.single();

selectedSkills=profile.skills||[];

renderSkillOptions(skillsDiv,selectedSkills,toggleUserSkill);
renderSkillOptions(jobSkillsDiv,selectedJobSkills,toggleJobSkill);

if(profile.role==="employer"){
applicantView.classList.add("hidden");
employerView.classList.remove("hidden");
loadMyJobs();
}else{
loadJobs();
}
}

supabase.auth.onAuthStateChange(()=>checkUser());
checkUser();
</script>
</body>
</html>
