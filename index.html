<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>QuickHire</title>

<style>
body{font-family:Arial;margin:0;background:#f4f7fb;}
header{background:#0b63ce;color:white;padding:15px;display:flex;justify-content:space-between;}
.container{padding:20px;}
.skill{padding:6px 10px;border:1px solid #ccc;border-radius:20px;margin:4px;display:inline-block;cursor:pointer;}
.selected{background:#0b63ce;color:white;}
.hidden{display:none;}
</style>
</head>

<body>

<header>
<h2>QuickHire</h2>
<div>
<button id="signupBtn">Sign Up</button>
<button id="loginBtn">Login</button>
<button id="logoutBtn" class="hidden">Logout</button>
</div>
</header>

<div class="container">

<h3>Your Skills</h3>
<input id="skillSearch" placeholder="Search skills">
<div id="skills"></div>

<h4>Saved Skills</h4>
<div id="mySkills"></div>

<button id="saveBtn">Save Skills</button>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://cwrschafpaerspklvoqk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3cnNjaGFmcGFlcnNwa2x2b3FrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NzM2MjIsImV4cCI6MjA4OTU0OTYyMn0.qaUuhw5YSi7aa_rT7dFrck26BnvSaAFSrrBwfclaCPw"
);

let user = null;
let selectedSkills = [];

const skills = [
"HTML","CSS","JavaScript","React","Node","Python","SQL","AWS","Docker","Figma"
];

const skillsDiv = document.getElementById("skills");
const mySkillsDiv = document.getElementById("mySkills");

/* ================= RENDER ================= */

function renderSkills(filter=""){
  skillsDiv.innerHTML = "";

  skills
  .filter(s => s.toLowerCase().includes(filter.toLowerCase()))
  .forEach(skill => {
    const el = document.createElement("span");
    el.innerText = skill;
    el.className = "skill";

    if(selectedSkills.includes(skill)){
      el.classList.add("selected");
    }

    el.onclick = () => {
      if(selectedSkills.includes(skill)){
        selectedSkills = selectedSkills.filter(x => x !== skill);
      } else {
        selectedSkills.push(skill);
      }
      renderSkills(document.getElementById("skillSearch").value);
      renderMySkills();
    };

    skillsDiv.appendChild(el);
  });
}

function renderMySkills(){
  mySkillsDiv.innerHTML = "";
  selectedSkills.forEach(s=>{
    const el=document.createElement("span");
    el.innerText=s;
    el.className="skill selected";
    mySkillsDiv.appendChild(el);
  });
}

/* ================= SAVE ================= */

document.getElementById("saveBtn").onclick = async () => {
  if(!user) return alert("Login first");

  const { error } = await supabase
    .from("users")
    .update({ skills: selectedSkills })
    .eq("id", user.id);

  if(error){
    console.error(error);
    return alert(error.message);
  }

  alert("Skills saved!");
};

/* ================= AUTH ================= */

signupBtn.onclick = async () => {
  const email = prompt("Email");
  const password = prompt("Password");

  const { data, error } = await supabase.auth.signUp({ email, password });

  if(error){
    console.error(error);
    return alert(error.message);
  }

  if(!data.user){
    alert("Check email to confirm signup");
    return;
  }

  const { error: insertError } = await supabase
    .from("users")
    .insert({ id: data.user.id, skills: [] });

  if(insertError){
    console.error(insertError);
    alert(insertError.message);
  }

  alert("Account created");
};

loginBtn.onclick = async () => {
  const email = prompt("Email");
  const password = prompt("Password");

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  if(error){
    console.error(error);
    return alert(error.message);
  }

  setTimeout(checkUser, 500);
};

logoutBtn.onclick = async () => {
  await supabase.auth.signOut();
  location.reload();
};

/* ================= USER ================= */

async function checkUser(){
  const { data, error } = await supabase.auth.getUser();

  if(error){
    console.error(error);
    return;
  }

  user = data.user;

  if(!user) return;

  signupBtn.classList.add("hidden");
  loginBtn.classList.add("hidden");
  logoutBtn.classList.remove("hidden");

  let { data: profile, error: profileError } = await supabase
    .from("users")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

  if(profileError){
    console.error(profileError);
    return;
  }

  if(!profile){
    const { data: inserted, error: insertError } = await supabase
      .from("users")
      .insert({ id: user.id, skills: [] })
      .select()
      .single();

    if(insertError){
      console.error(insertError);
      return;
    }

    profile = inserted;
  }

  selectedSkills = profile.skills || [];

  renderSkills();
  renderMySkills();
}

/* ================= EVENTS ================= */

document.getElementById("skillSearch").addEventListener("input", e=>{
  renderSkills(e.target.value);
});

/* ================= INIT ================= */

supabase.auth.onAuthStateChange(() => {
  checkUser();
});

renderSkills();
checkUser();

</script>

</body>
</html>
